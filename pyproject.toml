[project]
name = "tui_utilities"
version = "1.9.4"
description = "Personal-use console utilities library"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Guido Iván Gross", email = "grossguidoivan@gmail.com"}]
requires-python = ">=3.9"
dependencies = ["rich>=12.4.4", "readchar>=4.0.0", "requests>=2.25.0"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tui_utilities"]
include-package-data = true

[tool.setuptools.package-data]
tui_utilities = ["_tlds/tlds.txt"]